<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>コード読取テスト v0.5</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#fff;background:#000}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
    body{touch-action:manipulation;-webkit-user-select:none;user-select:none}
    .app{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}
    .topbar{padding:max(12px,env(safe-area-inset-top)) 14px 10px;background:#111;z-index:5}
    .title{font-size:18px;font-weight:800}
    .version{margin-left:6px;font-size:12px;font-weight:700;opacity:.65}
    .status{margin-top:8px;min-height:40px;border-radius:12px;padding:9px 12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;font-weight:700;background:#222}
    .status.ok{background:#135f2d}.status.err{background:#7c1f24}
    .camera-area{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
    #reader{width:100%;height:100%;background:#000}
    #reader__dashboard_section_csr button,#reader__dashboard_section_swaplink,#reader__dashboard_section_fsr,#reader__header_message,#reader__camera_selection{display:none!important}
    #reader video{width:100%!important;height:100%!important;object-fit:cover!important}
    .aim{position:absolute;left:50%;top:50%;width:min(72vw,360px);aspect-ratio:1/1;transform:translate(-50%,-50%);border:3px solid #ff3b30;border-radius:18px;pointer-events:none;box-shadow:0 0 0 200vmax rgba(0,0,0,.24);transition:border-color .15s,box-shadow .15s;z-index:3}
    .aim.ok{border-color:#34c759;box-shadow:0 0 0 200vmax rgba(0,0,0,.18)}
    .aim::before{content:"";position:absolute;left:12%;right:12%;top:50%;height:2px;transform:translateY(-50%);background:rgba(255,255,255,.9)}
    .aim-label{position:absolute;left:50%;top:calc(50% + min(36vw,180px) + 18px);transform:translateX(-50%);width:88%;text-align:center;z-index:4;font-size:13px;font-weight:700;text-shadow:0 1px 3px #000;pointer-events:none}
    .result-panel{padding:12px 14px max(14px,env(safe-area-inset-bottom));background:#111;min-height:126px;z-index:5}
    .result-label{font-size:12px;opacity:.7;margin-bottom:6px}
    .result{min-height:48px;padding:10px 12px;border-radius:11px;background:#222;font:800 18px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;user-select:text;-webkit-user-select:text}
    .result.empty{font-family:inherit;font-size:15px;font-weight:600;opacity:.6}
    .meta{margin-top:7px;font-size:12px;opacity:.7}
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title">コード読取テスト<span class="version">v0.5</span></div>
    <div id="status" class="status">カメラを起動しています…</div>
  </div>
  <div class="camera-area">
    <div id="reader"></div>
    <div id="aim" class="aim"></div>
    <div class="aim-label">QRコード / バーコードを枠内に入れてください</div>
  </div>
  <div class="result-panel">
    <div class="result-label">読み取った内容</div>
    <div id="result" class="result empty">まだ読み取っていません</div>
    <div id="meta" class="meta"></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  const metaEl = document.getElementById('meta');
  const aimEl = document.getElementById('aim');

  let lastText = '';
  let lastAt = 0;

  function setStatus(text, type = '') {
    statusEl.className = 'status' + (type ? ' ' + type : '');
    statusEl.textContent = text;
  }

  function onScanSuccess(decodedText, decodedResult) {
    const now = Date.now();
    if (decodedText === lastText && now - lastAt < 1200) return;

    lastText = decodedText;
    lastAt = now;
    resultEl.classList.remove('empty');
    resultEl.textContent = decodedText;

    const formatName =
      decodedResult?.result?.format?.formatName ||
      decodedResult?.result?.format?.toString?.() ||
      '';
    metaEl.textContent = formatName ? `形式: ${formatName}` : '';

    setStatus('読み取り成功', 'ok');
    aimEl.classList.add('ok');
    setTimeout(() => aimEl.classList.remove('ok'), 700);
    setTimeout(() => {
      if (Date.now() - lastAt >= 700) setStatus('コードを探しています…');
    }, 750);

    if (navigator.vibrate) {
      try { navigator.vibrate(80); } catch (_) {}
    }
  }

  function onScanFailure(_) {}

  async function start() {
    if (!window.Html5Qrcode) {
      setStatus('読取ライブラリを読み込めません', 'err');
      return;
    }

    const scanner = new Html5Qrcode('reader');

    const config = {
      fps: 15,
      qrbox: (vw, vh) => {
        const size = Math.floor(Math.min(vw, vh) * 0.72);
        return { width: size, height: size };
      },
      disableFlip: false,
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    };

    try {
      await scanner.start(
        { facingMode: 'environment' },
        config,
        onScanSuccess,
        onScanFailure
      );
      setStatus('コードを探しています…');
    } catch (err) {
      console.error(err);
      try {
        const cameras = await Html5Qrcode.getCameras();
        if (!cameras || !cameras.length) throw new Error('camera not found');
        const preferred =
          cameras.find(c => /back|rear|environment|背面|外向き/i.test(c.label)) ||
          cameras[cameras.length - 1];

        await scanner.start(preferred.id, config, onScanSuccess, onScanFailure);
        setStatus('コードを探しています…');
      } catch (err2) {
        console.error(err2);
        setStatus('カメラを起動できません。Safariのカメラ許可を確認してください', 'err');
      }
    }
  }

  start();
})();
</script>
</body>
</html>
