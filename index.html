<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>QR読取テスト v0.6</title>

  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      background: #000;
      -webkit-text-size-adjust: 100%;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      overscroll-behavior: none;
    }
    body {
      -webkit-user-select: none;
      user-select: none;
    }

    .app { position: fixed; inset: 0; background: #000; }
    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .topbar {
      position: absolute;
      z-index: 10;
      top: 0; left: 0; right: 0;
      padding: max(12px, env(safe-area-inset-top)) 14px 28px;
      background: linear-gradient(rgba(0,0,0,.78), rgba(0,0,0,0));
      pointer-events: none;
    }
    .title {
      font-size: 18px;
      font-weight: 800;
      text-shadow: 0 1px 3px #000;
    }
    .version {
      margin-left: 6px;
      font-size: 12px;
      font-weight: 700;
      opacity: .68;
    }
    .status {
      margin-top: 8px;
      min-height: 40px;
      padding: 9px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,.58);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
    }
    .status.ok { background: rgba(15,100,45,.82); }
    .status.warn { background: rgba(145,91,0,.85); }
    .status.err { background: rgba(130,25,30,.86); }

    /* この枠は「選択範囲」。解析自体はカメラ映像全体で行う */
    .target {
      position: absolute;
      z-index: 6;
      left: 50%;
      top: 50%;
      width: min(48vw, 280px);
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      border: 3px solid #ff453a;
      border-radius: 20px;
      pointer-events: none;
      transition: border-color .12s, box-shadow .12s, transform .12s;
      box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 0 12px rgba(255,69,58,.25);
    }
    .target::before {
      content: "";
      position: absolute;
      left: 50%; top: 50%;
      width: 10px; height: 10px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255,255,255,.95);
      border-radius: 50%;
      box-shadow: 0 1px 3px #000;
    }
    .target.ok {
      border-color: #32d74b;
      box-shadow: 0 0 18px rgba(50,215,75,.55);
      transform: translate(-50%, -50%) scale(1.02);
    }
    .target.warn {
      border-color: #ffd60a;
      box-shadow: 0 0 18px rgba(255,214,10,.45);
    }

    .guide {
      position: absolute;
      z-index: 6;
      left: 8%; right: 8%;
      top: calc(50% + min(24vw, 140px) + 18px);
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      text-shadow: 0 1px 4px #000;
      pointer-events: none;
    }

    .bottom {
      position: absolute;
      z-index: 10;
      left: 0; right: 0; bottom: 0;
      padding: 45px 14px max(16px, env(safe-area-inset-bottom));
      background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.86) 38%);
      pointer-events: none;
    }
    .result-label {
      font-size: 12px;
      font-weight: 700;
      opacity: .72;
      margin-bottom: 6px;
    }
    .result {
      min-height: 52px;
      display: flex;
      align-items: center;
      padding: 11px 13px;
      border-radius: 12px;
      background: rgba(24,24,24,.86);
      font: 800 19px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
      word-break: break-all;
      -webkit-user-select: text;
      user-select: text;
      pointer-events: auto;
    }
    .result.empty {
      font-family: inherit;
      font-size: 15px;
      font-weight: 650;
      opacity: .7;
    }
    .meta {
      min-height: 18px;
      margin-top: 7px;
      font-size: 12px;
      opacity: .72;
    }

    #scanCanvas { display: none; }
  </style>
</head>

<body>
<div class="app">
  <video id="video" playsinline muted autoplay></video>

  <div class="topbar">
    <div class="title">QR読取テスト<span class="version">v0.6</span></div>
    <div id="status" class="status">カメラを起動しています…</div>
  </div>

  <div id="target" class="target"></div>
  <div class="guide">読みたいQRの中心をこの枠へ</div>

  <div class="bottom">
    <div class="result-label">読み取った内容</div>
    <div id="result" class="result empty">まだ読み取っていません</div>
    <div id="meta" class="meta">映像全体を解析し、中央に近いQRだけ確定します</div>
  </div>
</div>

<canvas id="scanCanvas"></canvas>

<script>
(() => {
  'use strict';

  // ---- Zoom gesture prevention ----
  const stopGesture = e => { e.preventDefault(); };
  document.addEventListener('gesturestart', stopGesture, { passive: false });
  document.addEventListener('gesturechange', stopGesture, { passive: false });
  document.addEventListener('gestureend', stopGesture, { passive: false });
  document.addEventListener('dblclick', stopGesture, { passive: false });
  document.addEventListener('touchmove', e => {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd <= 320) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  // ---- Elements ----
  const video = document.getElementById('video');
  const canvas = document.getElementById('scanCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  const metaEl = document.getElementById('meta');
  const targetEl = document.getElementById('target');

  // ---- Tuning ----
  const ANALYSIS_LONG_EDGE = 960;    // speed/precision balance
  const LOOP_MS = 105;
  const CENTER_HALF_SIZE = 0.23;      // central acceptance square = 46% of short edge
  const STABLE_REQUIRED = 2;          // same QR must win twice
  const STABLE_WINDOW_MS = 900;
  const MAX_QR_PER_FRAME = 3;         // detect up to 3 by masking previous result
  const AMBIGUITY_MARGIN = 0.075;     // if two are almost equally central, don't decide

  let stream = null;
  let scanning = false;
  let candidateText = '';
  let candidateHits = 0;
  let candidateAt = 0;
  let lastConfirmed = '';
  let lastConfirmedAt = 0;

  function setStatus(text, type = '') {
    statusEl.className = 'status' + (type ? ' ' + type : '');
    statusEl.textContent = text;
  }

  function setTarget(type = '') {
    targetEl.className = 'target' + (type ? ' ' + type : '');
  }

  function cornersOf(code) {
    const l = code && code.location;
    if (!l) return [];
    return [
      l.topLeftCorner,
      l.topRightCorner,
      l.bottomRightCorner,
      l.bottomLeftCorner
    ].filter(Boolean);
  }

  function centerOf(code) {
    const pts = cornersOf(code);
    if (!pts.length) return null;
    const x = pts.reduce((s, p) => s + p.x, 0) / pts.length;
    const y = pts.reduce((s, p) => s + p.y, 0) / pts.length;
    return { x, y };
  }

  function maskCode(data, width, height, code) {
    const pts = cornersOf(code);
    if (!pts.length) return;

    const xs = pts.map(p => p.x);
    const ys = pts.map(p => p.y);
    const pad = Math.max(10, Math.round(Math.min(width, height) * 0.025));

    const x0 = Math.max(0, Math.floor(Math.min(...xs) - pad));
    const x1 = Math.min(width - 1, Math.ceil(Math.max(...xs) + pad));
    const y0 = Math.max(0, Math.floor(Math.min(...ys) - pad));
    const y1 = Math.min(height - 1, Math.ceil(Math.max(...ys) + pad));

    for (let y = y0; y <= y1; y++) {
      let i = (y * width + x0) * 4;
      for (let x = x0; x <= x1; x++) {
        data[i] = 255;
        data[i + 1] = 255;
        data[i + 2] = 255;
        data[i + 3] = 255;
        i += 4;
      }
    }
  }

  function decodeSeveral(imageData, width, height) {
    const working = new Uint8ClampedArray(imageData.data);
    const found = [];

    for (let n = 0; n < MAX_QR_PER_FRAME; n++) {
      const code = jsQR(working, width, height, {
        inversionAttempts: 'dontInvert'
      });
      if (!code) break;

      const c = centerOf(code);
      if (!c) break;

      const duplicate = found.some(x =>
        x.data === code.data &&
        Math.hypot(x.center.x - c.x, x.center.y - c.y) < 12
      );

      if (!duplicate) found.push({ data: code.data, center: c, raw: code });
      maskCode(working, width, height, code);
    }
    return found;
  }

  function chooseCentral(found, width, height) {
    if (!found.length) return { state: 'none' };

    const cx = width / 2;
    const cy = height / 2;
    const shortEdge = Math.min(width, height);
    const limit = shortEdge * CENTER_HALF_SIZE;

    const eligible = found
      .map(item => {
        const dx = item.center.x - cx;
        const dy = item.center.y - cy;
        return {
          ...item,
          dx, dy,
          distance: Math.hypot(dx, dy)
        };
      })
      .filter(item => Math.abs(item.dx) <= limit && Math.abs(item.dy) <= limit)
      .sort((a, b) => a.distance - b.distance);

    if (!eligible.length) {
      return { state: 'offcenter', count: found.length };
    }

    if (eligible.length >= 2) {
      const gap = (eligible[1].distance - eligible[0].distance) / shortEdge;
      if (gap < AMBIGUITY_MARGIN) {
        return { state: 'ambiguous', count: eligible.length };
      }
    }

    return {
      state: 'chosen',
      chosen: eligible[0],
      totalFound: found.length
    };
  }

  function resetCandidate() {
    candidateText = '';
    candidateHits = 0;
    candidateAt = 0;
  }

  function handleChoice(choice) {
    const now = Date.now();

    if (choice.state === 'none') {
      setTarget('');
      setStatus('QRコードを探しています…');
      resetCandidate();
      return;
    }

    if (choice.state === 'offcenter') {
      setTarget('warn');
      setStatus('QRを中央の枠へ合わせてください', 'warn');
      resetCandidate();
      return;
    }

    if (choice.state === 'ambiguous') {
      setTarget('warn');
      setStatus('中央付近にQRが複数あります。1つを中央へ', 'warn');
      resetCandidate();
      return;
    }

    const text = choice.chosen.data;

    if (text === lastConfirmed && now - lastConfirmedAt < 1800) {
      setTarget('ok');
      setStatus('読み取り成功', 'ok');
      return;
    }

    if (text === candidateText && now - candidateAt <= STABLE_WINDOW_MS) {
      candidateHits++;
    } else {
      candidateText = text;
      candidateHits = 1;
    }
    candidateAt = now;

    if (candidateHits < STABLE_REQUIRED) {
      setTarget('warn');
      setStatus(`確認中… ${text}`, 'warn');
      return;
    }

    lastConfirmed = text;
    lastConfirmedAt = now;
    resultEl.classList.remove('empty');
    resultEl.textContent = text;
    metaEl.textContent = choice.totalFound > 1
      ? `検出 ${choice.totalFound}個 → 中央のQRを選択`
      : '中央のQRを確定';
    setTarget('ok');
    setStatus('読み取り成功', 'ok');
    resetCandidate();

    if (navigator.vibrate) {
      try { navigator.vibrate(70); } catch (_) {}
    }
  }

  function setCanvasSize() {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh) return false;

    const scale = Math.min(1, ANALYSIS_LONG_EDGE / Math.max(vw, vh));
    const w = Math.max(2, Math.round(vw * scale));
    const h = Math.max(2, Math.round(vh * scale));

    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    return true;
  }

  async function scanOnce() {
    if (!scanning || video.readyState < 2 || !window.jsQR) return;

    if (!setCanvasSize()) return;

    try {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const found = decodeSeveral(imageData, canvas.width, canvas.height);
      const choice = chooseCentral(found, canvas.width, canvas.height);
      handleChoice(choice);
    } catch (err) {
      console.error(err);
    }
  }

  function scanLoop() {
    if (!scanning) return;
    scanOnce();
    setTimeout(scanLoop, LOOP_MS);
  }

  async function tryContinuousFocus(track) {
    try {
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (Array.isArray(caps.focusMode) && caps.focusMode.includes('continuous')) {
        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      }
    } catch (_) {}
  }

  async function startCamera() {
    if (!navigator.mediaDevices?.getUserMedia) {
      setStatus('この環境ではカメラを利用できません', 'err');
      return;
    }
    if (!window.jsQR) {
      setStatus('QR読取ライブラリを読み込めません', 'err');
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });

      video.srcObject = stream;
      await video.play();

      const track = stream.getVideoTracks()[0];
      if (track) await tryContinuousFocus(track);

      scanning = true;
      setStatus('QRコードを探しています…');
      scanLoop();
    } catch (err) {
      console.error(err);
      setStatus('カメラを起動できません。Safariのカメラ許可を確認してください', 'err');
    }
  }

  window.addEventListener('pagehide', () => {
    scanning = false;
    if (stream) stream.getTracks().forEach(t => t.stop());
  });

  startCamera();
})();
</script>
</body>
</html>
