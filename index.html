<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Driveアップロード診断 v0.7</title>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  color:#fff;background:#000;-webkit-text-size-adjust:100%
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  touch-action:none;overscroll-behavior:none
}
body{-webkit-user-select:none;user-select:none}
button,input{font:inherit}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}
.topbar{
  flex:0 0 auto;padding:max(10px,env(safe-area-inset-top)) 12px 10px;
  background:#111;border-bottom:1px solid #2a2a2a
}
.title{font-size:17px;font-weight:800}
.version{margin-left:6px;font-size:12px;opacity:.62}
.sub{
  margin-top:5px;font-size:12px;color:#bbb;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis
}
.camera-wrap{position:relative;flex:1 1 auto;min-height:180px;background:#000;overflow:hidden}
#video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.camera-info{
  position:absolute;left:10px;top:10px;padding:6px 9px;border-radius:9px;
  background:rgba(0,0,0,.58);font-size:12px;font-weight:700;pointer-events:none
}
.guide{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none
}
.guide-box{
  width:min(82vw,520px);height:min(42vw,260px);border:2px solid rgba(255,255,255,.75);
  border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.08)
}
.panel{
  flex:0 0 auto;background:#111;padding:10px 12px max(12px,env(safe-area-inset-bottom));
  max-height:52vh;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y
}
.stage-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:7px;touch-action:pan-x}
.stage-btn{
  border:1px solid #444;background:#222;color:#ddd;border-radius:9px;
  padding:8px 10px;font-size:12px;font-weight:800;white-space:nowrap
}
.stage-btn.active{background:#fff;color:#111;border-color:#fff}
.stage-btn.pass{border-color:#2fb950}
.stage-btn.fail{border-color:#ff453a}
.stage-title{font-size:15px;font-weight:800;margin:2px 0 4px}
.stage-desc{font-size:12px;color:#bbb;line-height:1.35}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.action{
  min-height:48px;border:0;border-radius:11px;font-weight:800;font-size:15px
}
.capture{background:#fff;color:#111}
.capture:disabled{opacity:.42}
.retry{background:#333;color:#fff}
.status{
  margin-top:9px;min-height:42px;border-radius:10px;padding:9px 10px;
  background:#222;display:flex;align-items:center;font-size:13px;font-weight:750
}
.status.ok{background:#145c2d}
.status.err{background:#792329}
.status.warn{background:#725000}
.metrics{
  margin-top:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px
}
.metric{background:#1c1c1e;border-radius:9px;padding:8px}
.metric .k{font-size:10px;color:#999}
.metric .v{margin-top:2px;font-size:13px;font-weight:800;word-break:break-all}
.history-title{margin-top:10px;font-size:12px;font-weight:800;color:#ccc}
table{width:100%;border-collapse:collapse;margin-top:5px;font-size:11px}
th,td{padding:6px 4px;border-bottom:1px solid #2b2b2b;text-align:left;vertical-align:top}
th{color:#999;font-weight:700;position:sticky;top:0;background:#111}
.oktxt{color:#4ed66b;font-weight:800}
.errtxt{color:#ff6961;font-weight:800}
.toolbar{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
.small{
  min-height:34px;border:1px solid #444;border-radius:8px;background:#222;color:#ddd;
  padding:5px 9px;font-size:11px;font-weight:750
}
.settings{
  position:fixed;inset:0;z-index:30;background:#f4f4f6;color:#111;
  padding:max(20px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));
  overflow:auto;touch-action:pan-y
}
.settings.hidden{display:none}
.settings-inner{max-width:600px;margin:0 auto}
.settings h1{font-size:23px;margin:4px 0 6px}
.settings p{font-size:13px;color:#666;line-height:1.5}
.settings label{display:block;margin:15px 0 6px;font-size:12px;font-weight:800}
.settings input{
  width:100%;min-height:48px;border:1px solid #bbb;border-radius:10px;background:#fff;
  color:#111;padding:9px 10px;-webkit-user-select:text;user-select:text
}
.settings .save{
  width:100%;min-height:50px;margin-top:12px;border:0;border-radius:11px;
  background:#111;color:#fff;font-weight:800
}
#workCanvas,#uploadForm,#uploadFrame{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title">Driveアップロード診断<span class="version">v0.7</span></div>
    <div id="topSub" class="sub">カメラ起動中…</div>
  </div>

  <div class="camera-wrap">
    <video id="video" playsinline muted autoplay></video>
    <div id="cameraInfo" class="camera-info">camera: --</div>
    <div class="guide"><div class="guide-box"></div></div>
  </div>

  <div class="panel">
    <div id="stageRow" class="stage-row"></div>
    <div id="stageTitle" class="stage-title"></div>
    <div id="stageDesc" class="stage-desc"></div>

    <div class="actions">
      <button id="captureBtn" class="action capture" disabled>撮影して送信</button>
      <button id="retryBtn" class="action retry" disabled>同じ段階を再テスト</button>
    </div>

    <div id="status" class="status">カメラを起動しています…</div>

    <div class="metrics">
      <div class="metric"><div class="k">保存画像</div><div id="mResolution" class="v">--</div></div>
      <div class="metric"><div class="k">JPEG容量</div><div id="mJpeg" class="v">--</div></div>
      <div class="metric"><div class="k">POSTデータ量</div><div id="mPost" class="v">--</div></div>
      <div class="metric"><div class="k">アップロード時間</div><div id="mTime" class="v">--</div></div>
    </div>

    <div class="toolbar">
      <button id="settingsBtn" class="small">Apps Script設定</button>
      <button id="clearBtn" class="small">結果を消去</button>
    </div>

    <div class="history-title">テスト履歴</div>
    <table>
      <thead><tr><th>段階</th><th>解像度</th><th>JPEG</th><th>時間</th><th>結果</th></tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>
</div>

<section id="settings" class="settings hidden">
  <div class="settings-inner">
    <h1>Apps Script設定</h1>
    <p>既存のGoogle Drive保存用WebアプリURLを使用します。URLはこの端末に保存します。</p>
    <label for="backendUrl">WebアプリURL</label>
    <input id="backendUrl" type="url" inputmode="url" autocapitalize="none" autocomplete="off">
    <button id="saveSettings" class="save">保存して戻る</button>
  </div>
</section>

<canvas id="workCanvas"></canvas>
<form id="uploadForm" method="post" target="uploadFrame">
  <input id="formBarcode" name="barcode">
  <input id="formDataUrl" name="dataUrl">
</form>
<iframe id="uploadFrame" name="uploadFrame" title="upload target"></iframe>

<script>
(() => {
'use strict';

const DEFAULT_BACKEND =
  'https://script.google.com/macros/s/AKfycbxZ52qCYw_KRgrcwvblPt-jXMh0o4apJFJDVpvEHBySyZnfw22v1jbeTGXxFDr9u0-u/exec';
const STORAGE_KEY = 'driveUploadDiagnostic.backend.v07';

const STAGES = [
  { id:'S1', name:'① 軽量',      maxLong:1280, quality:0.72, note:'通信経路の疎通確認。まずここが安定して通るかを見る。' },
  { id:'S2', name:'② 1080p',     maxLong:1920, quality:0.82, note:'一般的な記録写真レベル。' },
  { id:'S3', name:'③ 1440p',     maxLong:2560, quality:0.88, note:'細部確認を少し重視。' },
  { id:'S4', name:'④ 4K標準',    maxLong:3840, quality:0.90, note:'4K相当。ホチキス確認用途の本命候補。' },
  { id:'S5', name:'⑤ 4K高画質',  maxLong:3840, quality:0.95, note:'容量増加を許容して細部を優先。' }
];

const video = document.getElementById('video');
const cameraInfo = document.getElementById('cameraInfo');
const topSub = document.getElementById('topSub');
const stageRow = document.getElementById('stageRow');
const stageTitle = document.getElementById('stageTitle');
const stageDesc = document.getElementById('stageDesc');
const captureBtn = document.getElementById('captureBtn');
const retryBtn = document.getElementById('retryBtn');
const statusEl = document.getElementById('status');
const mResolution = document.getElementById('mResolution');
const mJpeg = document.getElementById('mJpeg');
const mPost = document.getElementById('mPost');
const mTime = document.getElementById('mTime');
const historyBody = document.getElementById('historyBody');
const clearBtn = document.getElementById('clearBtn');
const settingsBtn = document.getElementById('settingsBtn');
const settings = document.getElementById('settings');
const backendUrl = document.getElementById('backendUrl');
const saveSettings = document.getElementById('saveSettings');
const canvas = document.getElementById('workCanvas');
const ctx = canvas.getContext('2d');
const uploadForm = document.getElementById('uploadForm');
const uploadFrame = document.getElementById('uploadFrame');
const formBarcode = document.getElementById('formBarcode');
const formDataUrl = document.getElementById('formDataUrl');

let stream = null;
let currentStage = 0;
let lastPayload = null;
let uploadStartedAt = 0;
let uploadTimer = null;
let uploadTimeout = null;
let waitingResponse = false;
let frameLoadSeen = false;
let history = [];
let stageStates = {};

function blockZoom() {
  const prevent = e => e.preventDefault();
  document.addEventListener('gesturestart', prevent, {passive:false});
  document.addEventListener('gesturechange', prevent, {passive:false});
  document.addEventListener('gestureend', prevent, {passive:false});
  document.addEventListener('dblclick', prevent, {passive:false});
  document.addEventListener('touchmove', e => {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, {passive:false});
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd < 320) e.preventDefault();
    lastTouchEnd = now;
  }, {passive:false});
}

function fmtBytes(bytes) {
  if (!Number.isFinite(bytes)) return '--';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' KB';
  return (bytes/1024/1024).toFixed(2) + ' MB';
}

function fmtSec(ms) {
  if (!Number.isFinite(ms)) return '--';
  return (ms/1000).toFixed(1) + ' s';
}

function setStatus(text, type='') {
  statusEl.className = 'status' + (type ? ' ' + type : '');
  statusEl.textContent = text;
}

function backend() {
  return localStorage.getItem(STORAGE_KEY) || DEFAULT_BACKEND;
}

function validBackend(value) {
  return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(String(value||'').trim());
}

function renderStages() {
  stageRow.innerHTML = '';
  STAGES.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'stage-btn' + (i===currentStage ? ' active' : '') +
      (stageStates[s.id] === 'pass' ? ' pass' : '') +
      (stageStates[s.id] === 'fail' ? ' fail' : '');
    b.textContent = s.name;
    b.addEventListener('click', () => {
      if (waitingResponse) return;
      currentStage = i;
      renderStages();
      renderStageInfo();
    });
    stageRow.appendChild(b);
  });
}

function renderStageInfo() {
  const s = STAGES[currentStage];
  stageTitle.textContent = `${s.name} / 長辺最大 ${s.maxLong}px / JPEG ${Math.round(s.quality*100)}%`;
  stageDesc.textContent = s.note;
}

function renderHistory() {
  historyBody.innerHTML = '';
  history.slice().reverse().forEach(h => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td>${h.stage}</td>` +
      `<td>${h.resolution}</td>` +
      `<td>${h.jpeg}</td>` +
      `<td>${h.time}</td>` +
      `<td class="${h.ok ? 'oktxt':'errtxt'}">${h.ok ? '成功':'失敗'}</td>`;
    historyBody.appendChild(tr);
  });
}

async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus('この環境ではカメラを利用できません', 'err');
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:3840},
        height:{ideal:2160}
      }
    });
    video.srcObject = stream;
    await video.play();

    const track = stream.getVideoTracks()[0];
    const settings = track?.getSettings ? track.getSettings() : {};
    const w = settings.width || video.videoWidth || 0;
    const h = settings.height || video.videoHeight || 0;
    cameraInfo.textContent = `camera: ${w} × ${h}`;
    topSub.textContent = `取得映像 ${w} × ${h} / 4K要求（実際の解像度を上に表示）`;
    captureBtn.disabled = false;
    retryBtn.disabled = false;
    setStatus('撮影して送信できます');
  } catch (e) {
    console.error(e);
    setStatus('カメラを起動できません。Safariのカメラ許可を確認してください', 'err');
  }
}

function scaledSize(srcW, srcH, maxLong) {
  const long = Math.max(srcW, srcH);
  if (long <= maxLong) return {w:srcW, h:srcH};
  const scale = maxLong / long;
  return {
    w:Math.max(2, Math.round(srcW*scale)),
    h:Math.max(2, Math.round(srcH*scale))
  };
}

function canvasToBlob(canvas, quality) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (blob) resolve(blob);
      else reject(new Error('JPEG変換に失敗しました'));
    }, 'image/jpeg', quality);
  });
}

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result || ''));
    fr.onerror = () => reject(fr.error || new Error('Base64変換に失敗'));
    fr.readAsDataURL(blob);
  });
}

function timestampName(stageId) {
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `UPLOADTEST-${stageId}-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

async function prepareCurrentStage() {
  if (!video.videoWidth || !video.videoHeight) throw new Error('カメラ映像が準備できていません');

  const s = STAGES[currentStage];
  const size = scaledSize(video.videoWidth, video.videoHeight, s.maxLong);
  canvas.width = size.w;
  canvas.height = size.h;

  ctx.drawImage(video, 0, 0, size.w, size.h);
  const blob = await canvasToBlob(canvas, s.quality);
  const dataUrl = await blobToDataUrl(blob);

  // dataURLのUTF-8文字列長はASCIIなので、そのまま概算送信量として使える
  const postBytes = new Blob([
    'barcode=', encodeURIComponent(timestampName(s.id)),
    '&dataUrl=', encodeURIComponent(dataUrl)
  ]).size;

  return {
    stageIndex:currentStage,
    stage:s,
    blob,
    dataUrl,
    postBytes,
    resolution:`${size.w} × ${size.h}`,
    name:timestampName(s.id)
  };
}

function updateMetrics(p) {
  mResolution.textContent = p.resolution;
  mJpeg.textContent = fmtBytes(p.blob.size);
  mPost.textContent = fmtBytes(p.postBytes);
  mTime.textContent = '--';
}

function clearUploadTimers() {
  if (uploadTimer) clearInterval(uploadTimer);
  if (uploadTimeout) clearTimeout(uploadTimeout);
  uploadTimer = null;
  uploadTimeout = null;
}

function finishUpload(ok, detail='') {
  if (!waitingResponse) return;
  waitingResponse = false;
  clearUploadTimers();

  const elapsed = Date.now() - uploadStartedAt;
  mTime.textContent = fmtSec(elapsed);

  const p = lastPayload;
  const state = ok ? 'pass' : 'fail';
  stageStates[p.stage.id] = state;

  history.push({
    stage:p.stage.name,
    resolution:p.resolution,
    jpeg:fmtBytes(p.blob.size),
    time:fmtSec(elapsed),
    ok
  });
  renderHistory();
  renderStages();

  if (ok) {
    setStatus(`保存成功 ${fmtBytes(p.blob.size)} / ${fmtSec(elapsed)}${detail ? ' / '+detail : ''}`, 'ok');

    // 成功時だけ次段階へ自動移動
    if (currentStage < STAGES.length - 1) {
      currentStage++;
      renderStages();
      renderStageInfo();
    }
  } else {
    setStatus(`保存失敗${detail ? '：'+detail : ''}`, 'err');
  }

  captureBtn.disabled = false;
  retryBtn.disabled = false;
}

function normalizeMessage(data) {
  let d = data;
  if (typeof d === 'string') {
    try { d = JSON.parse(d); } catch (_) {
      const lower = d.toLowerCase();
      if (lower.includes('success') || lower.includes('保存しました') || lower === 'ok') {
        return {recognized:true, ok:true, detail:d};
      }
      if (lower.includes('error') || lower.includes('fail')) {
        return {recognized:true, ok:false, detail:d};
      }
      return {recognized:false};
    }
  }
  if (!d || typeof d !== 'object') return {recognized:false};

  const ok =
    d.ok === true ||
    d.success === true ||
    d.status === 'ok' ||
    d.status === 'success';

  const fail =
    d.ok === false ||
    d.success === false ||
    d.status === 'error' ||
    d.status === 'failed' ||
    !!d.error;

  const detail = d.fileName || d.filename || d.message || d.error || '';
  if (ok) return {recognized:true, ok:true, detail:String(detail||'')};
  if (fail) return {recognized:true, ok:false, detail:String(detail||'')};
  return {recognized:false};
}

window.addEventListener('message', e => {
  if (!waitingResponse) return;
  const origin = String(e.origin || '');
  if (origin && !/googleusercontent\.com$|script\.google\.com$/.test(origin.replace(/^https?:\/\//,''))) {
    return;
  }
  const r = normalizeMessage(e.data);
  if (r.recognized) finishUpload(r.ok, r.detail);
});

uploadFrame.addEventListener('load', () => {
  if (!waitingResponse) return;
  frameLoadSeen = true;
});

function sendPayload(p) {
  const url = backend();
  if (!validBackend(url)) {
    setStatus('Apps Script URLが不正です', 'err');
    settings.classList.remove('hidden');
    return;
  }

  waitingResponse = true;
  frameLoadSeen = false;
  uploadStartedAt = Date.now();
  captureBtn.disabled = true;
  retryBtn.disabled = true;

  uploadForm.action = url;
  formBarcode.value = p.name;
  formDataUrl.value = p.dataUrl;

  setStatus(`送信中… ${fmtBytes(p.blob.size)}`, 'warn');

  uploadTimer = setInterval(() => {
    const ms = Date.now() - uploadStartedAt;
    mTime.textContent = fmtSec(ms);
    setStatus(`送信中… ${fmtBytes(p.blob.size)} / ${fmtSec(ms)}`, 'warn');
  }, 250);

  uploadTimeout = setTimeout(() => {
    const msg = frameLoadSeen
      ? '送信先ページは読み込まれましたが、成功通知が返りませんでした'
      : '60秒以内に応答がありませんでした';
    finishUpload(false, msg);
  }, 60000);

  try {
    uploadForm.submit();
  } catch (e) {
    console.error(e);
    finishUpload(false, e.message || 'フォーム送信エラー');
  }
}

async function runTest(reuse=false) {
  if (waitingResponse) return;

  try {
    setStatus(reuse ? '同じ画像を再送信する準備中…' : 'JPEGを作成しています…', 'warn');
    captureBtn.disabled = true;
    retryBtn.disabled = true;

    let p;
    if (reuse && lastPayload && lastPayload.stageIndex === currentStage) {
      p = lastPayload;
    } else {
      p = await prepareCurrentStage();
      lastPayload = p;
      updateMetrics(p);
    }

    sendPayload(p);
  } catch (e) {
    console.error(e);
    setStatus(e.message || '撮影処理に失敗しました', 'err');
    captureBtn.disabled = false;
    retryBtn.disabled = false;
  }
}

captureBtn.addEventListener('click', () => runTest(false));
retryBtn.addEventListener('click', () => runTest(true));

settingsBtn.addEventListener('click', () => {
  backendUrl.value = backend();
  settings.classList.remove('hidden');
});

saveSettings.addEventListener('click', () => {
  const value = backendUrl.value.trim();
  if (!validBackend(value)) {
    alert('Apps Script WebアプリURL（末尾 /exec）を入力してください');
    return;
  }
  localStorage.setItem(STORAGE_KEY, value);
  settings.classList.add('hidden');
  setStatus('Apps Script URLを保存しました');
});

clearBtn.addEventListener('click', () => {
  history = [];
  stageStates = {};
  lastPayload = null;
  renderHistory();
  renderStages();
  mResolution.textContent = '--';
  mJpeg.textContent = '--';
  mPost.textContent = '--';
  mTime.textContent = '--';
  setStatus('結果を消去しました');
});

window.addEventListener('pagehide', () => {
  clearUploadTimers();
  if (stream) stream.getTracks().forEach(t => t.stop());
});

blockZoom();
renderStages();
renderStageInfo();
backendUrl.value = backend();
startCamera();

})();
</script>
</body>
</html>
